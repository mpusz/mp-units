## MrDocs POC configuration.
## Paths are relative to this file; see run.sh for how it is invoked.
##
## Modelled on the config the MrDocs maintainers use for the mp-units demo
## (examples/third-party/mp-units/docs/mrdocs.yml in their repo), extended from
## core to the whole library.

## No compilation database: MrDocs walks the headers and treats each as its own
## translation unit. mp-units headers are self-contained (CI enforces it via
## all_verify_interface_header_sets), so this needs no aggregate TU and no
## generated compile_commands.json.
source-root: ../../src
input:
  - ../../src/core/include
  - ../../src/systems/include
  - ../../src/utility/include
includes:
  - ../../src/core/include
  - ../../src/systems/include
  - ../../src/utility/include
file-patterns:
  - "*.h"
exclude:
  - ../../src/core/include/mp-units/bits
  - ../../src/core/include/mp-units/ext

include-symbols:
  - "mp_units::**"

## Makes the "Declared in <...>" path a link to the file and line on GitHub,
## joined with each symbol's path relative to `source-root` (which is `src/`).
## run.sh overrides this with the exact tag or commit being documented; the
## value here is only a fallback for running mrdocs by hand.
base-url: https://github.com/mpusz/mp-units/blob/master/src/

## `mp_units::detail` is private. Rendering it "implementation-defined" rather
## than excluding it gives base-class lists the `/* implementation-defined */`
## the upstream demo shows, instead of leaking `detail::quantity_iface`.
##
## CAVEAT: either way, `quantity`'s hidden-friend operators are lost. They are
## declared inside `detail::quantity_iface`, so filtering the namespace drops
## them: `operator==` and `operator<=>` end up documented nowhere. The upstream
## demo has the same hole - its `quantity` page lists `operator*` and no
## comparison at all. See the upstream ask about promoting hidden friends.
implementation-defined:
  - "mp_units::detail"
  - "mp_units::**::detail"

addons-supplemental:
  - ./addons

## `generator: [md, mkdocs-nav]` with per-generator `output` works and keeps both
## outputs flat in one directory, but the `mkdocs-nav` script generator never
## completes on this corpus (~7500 symbols) - see addons/extensions/. The MkDocs
## hook derives the nav itself for now.
## `copy-dependencies` (the default) copies members of an undocumented base into
## the derived class, which drags libstdc++ internals into the reference: the
## `random.h` wrappers derive from `std::` distributions, giving us pages for
## `__generate`, `param` and friends. 144 such pages, and `utility` alone drops
## from 1065 pages to 538 without them.
inherit-base-members: reference

generator: md
multipage: true
legible-names: true
non-standard-attributes: false
output: ../../docs/reference/api_reference/mrdocs
warn-if-undocumented: false
report: 2
