name: 🛠️ [MAINTAINERS ONLY] Good First Issue Template
description: "⚠️ For project maintainers creating curated onboarding tasks. Contributors: use Bug Report or Feature Request instead."
title: "Good First Issue: "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Maintainers Only

        **If you are a contributor** looking to report a bug or request a feature, please go back and
        select the appropriate template:
        - 🐛 **Bug Report** for issues you've encountered
        - 🚀 **Feature Request** for new functionality
        - 📚 **Documentation Issue** for documentation problems

        ---

        ## 🎯 For Maintainers: Creating Mentored First Contributions

        This template helps create **well-structured good-first-issues** that provide:
        - Clear scope and deliverables
        - Rationale for the work
        - Explicit mentorship commitment
        - Learning objectives
        - Time estimation

        **Before filing, check the task against "What makes a good first issue here" in
        `CLAUDE.md`.** In short: no ISQ modeling, no paywalled standard, no domain expertise the
        issue cannot supply, and nothing blocked on a decision that has not been made yet.

        Issue #831 is a worked example of the shape below.

  - type: textarea
    id: what
    attributes:
      label: "📝 What"
      description: |
        Clear, specific description of the task.
        Include file paths, function names, or specific deliverables.
      placeholder: |
        `scripts/codata_constants.py` generates nine headers from the NIST tables checked in under
        `scripts/codata/`, and already knows how to verify itself:

        ```bash
        python3 scripts/codata_constants.py --check
        ```

        Nothing calls it. Add it to `.pre-commit-config.yaml` as a `repo: local` hook so it runs on
        every commit and in CI.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "💡 Why"
      description: |
        Explain the rationale and impact of this work.
        Why does this task matter? What problem does it solve?
      placeholder: |
        These headers are generated, checked in, and unverified. A hand edit to one of them, or a
        change to the generator that nobody reruns, passes CI today without complaint.

        State the limits too, so the contributor knows what the work is worth: the numeric check
        never reads the checked-in files, and the NIST tables are themselves checked in.
    validations:
      required: true

  - type: input
    id: mentorship
    attributes:
      label: "🤝 Mentorship"
      description: Who will guide the contributor through the PR process?
      placeholder: "@mpusz will help you through the PR process"
      value: "@mpusz will help you through the PR process"
    validations:
      required: true

  - type: textarea
    id: skills_learned
    attributes:
      label: "📚 Skills Learned"
      description: |
        What will the contributor learn by completing this task?
        List specific concepts, APIs, or techniques.
      placeholder: |
        - How a repository with generated sources stays consistent: generate, check in, verify
        - Writing a `pre-commit` hook, including the settings that decide when it runs
        - How the formatting CI job turns a local hook into a pull-request gate
        - Reading a code generator well enough to know what its check does and does not prove
    validations:
      required: true

  - type: dropdown
    id: estimated_time
    attributes:
      label: "⏱️ Estimated Time"
      description: Realistic time estimate for someone new to the project
      options:
        - 1 hour
        - 2 hours
        - 3-4 hours
        - 4-8 hours
        - 8+ hours
    validations:
      required: true

  - type: textarea
    id: getting_started
    attributes:
      label: "🚀 Getting Started"
      description: |
        Optional: Provide specific guidance on how to begin.
        Link to relevant docs, similar examples, or key files to review.
      placeholder: |
        1. Install the tooling: `pip install -U pre-commit` (see `CONTRIBUTING.md`), then run the
           check and confirm it passes, so you start from green
        2. Break it deliberately, watch it fail, then revert. Knowing the failure mode comes first
        3. Read `.pre-commit-config.yaml`, and the pre-commit docs on repository-local hooks
        4. Name the trap they will hit: the `meta` hooks include `check-hooks-apply`, which fails a
           hook whose `files` pattern matches nothing

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: |
        Optional: Define when this task is complete.
        Be specific about expected behavior, test cases, or documentation.
      placeholder: |
        - [ ] `pre-commit run --all-files` runs the new check
        - [ ] It fails when a generated header is edited by hand, and passes once it is reverted
        - [ ] The `files` pattern covers everything it depends on, naming each path explicitly
        - [ ] `pre-commit run --all-files` passes on a clean checkout

  - type: textarea
    id: additional_context
    attributes:
      label: "📎 Additional Context"
      description: |
        Any other helpful information: links to discussions, related issues, or background.
      placeholder: |
        Related to discussion: #123
        Similar example in another project: <link>
