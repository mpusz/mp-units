name: Compiler Setup Test

# `.devcontainer/setup_compilers.sh` sets up the compiler matrix of the `trainiteu/mp-units`
# image and of a developer's own machine. Nothing else in CI runs it, so it is run here on the
# Ubuntu release the image is built on, and its own final step checks that every compiler
# works.
on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/setup_compilers.sh"
      - ".github/workflows/setup-compilers-test.yml"
  pull_request:
    paths:
      - ".devcontainer/setup_compilers.sh"
      - ".github/workflows/setup-compilers-test.yml"
  schedule:
    # Weekly, because the apt.llvm.org snapshot suites the script installs from change daily
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-compilers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ubuntu:resolute

    steps:
      - name: Install the script's prerequisites
        # What a bare Ubuntu image lacks: curl to fetch the LLVM key and the clang-16 tarball,
        # binutils for `nm`, and xz-utils to unpack that tarball
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl binutils xz-utils

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up the compiler matrix
        run: bash .devcontainer/setup_compilers.sh
