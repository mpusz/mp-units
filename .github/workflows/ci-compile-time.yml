# Gates changes on the template-instantiation counts of the mp-units-benchmarks corpus. That metric
# is deterministic for a pinned clang, so unlike wall-clock timings it is trustworthy on hosted
# runners.
#
# Two pins matter:
#   * BENCH_REF - an exact commit of mpusz/mp-units-benchmarks, never a branch. A branch would let a
#     corpus change reach this gate unreviewed, and it breaks maintenance work outright: when the
#     suite's main eventually follows the library to v3, a 2.6.x branch here still needs the last
#     suite commit that supports v2. Each branch of this repository therefore pins the suite commit
#     matching its own era, and bumping the pin is a reviewed change like any other. Note the suite
#     tracks THIS repository's master in its own CI - each side pins the other, neither pins itself.
#   * CLANG_VERSION - must match the suite's baseline key (baselines/instantiations-<key>.json).
#
# The bands here are deliberately looser than the ones the benchmarks repository applies to itself:
# SLACK/MEDIAN_ALARM decide what BLOCKS a change, while ADVISORY_SLACK only annotates. A minor
# framework extension that grows a workflow by a couple of percent therefore reports here without
# stopping the work, and goes red in the benchmarks repository instead - where it can be
# investigated, and either accepted with a reviewed `bench.py update` or chased down, without
# holding up mp-units.
#
# When growth is intentional, re-record in the benchmarks repository (`bench.py update`, optionally
# `--workflows <filters>` to move only the affected entries) and bump BENCH_REF here. Umbrella
# workflows are churn-expected and excluded from the framework-wide median alarm, so ordinary growth
# of the systems does not trip it.
# Only the gate lives here. Wall time and peak memory across several compilers are a different
# question - asked occasionally rather than on every build - and the `Compile cost` workflow in
# mp-units-benchmarks answers it, dispatched against any ref of this repository, feature branches
# included.
#
# No workflow_dispatch on purpose: the baselines describe one library state, so running this against
# an arbitrary older branch or tag would compare it against thresholds recorded for a different tree
# and fail for reasons that say nothing about that branch.
name: Compile-time CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_REF: 17c5868cc3b9b604dcbb25d1e71ab5396dd4c216 # mp-units-benchmarks, exact commit - never a branch
  CLANG_VERSION: 21
  SLACK: 3 # per-workflow growth that blocks a change
  MEDIAN_ALARM: 2 # framework-wide median growth that blocks
  ADVISORY_SLACK: 1 # growth reported as a warning without blocking

jobs:
  instantiations:
    # One gate per supported language standard: counts differ per -std, and a regression can appear
    # in one standard alone. Each has its own reviewed baselines in the benchmarks repository.
    strategy:
      fail-fast: false
      matrix:
        std: [c++20, c++23, c++26]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check out the compile-time benchmark suite
        uses: actions/checkout@v5
        with:
          repository: mpusz/mp-units-benchmarks
          ref: ${{ env.BENCH_REF }}
          path: benchmarks
      - name: Install Clang ${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_VERSION }}
      - name: Install Libc++
        shell: bash
        run: |
          sudo apt install -y libc++-${{ env.CLANG_VERSION }}-dev libc++abi-${{ env.CLANG_VERSION }}-dev libunwind-${{ env.CLANG_VERSION }}-dev
      - name: Record what was measured
        shell: bash
        run: |
          {
            echo "| measured | value |"
            echo "|---|---|"
            echo "| this tree | \`${{ github.ref_name }}\` @ $(git describe --tags --always --dirty) |"
            echo "| library version | $(sed -nE 's/.*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' src/CMakeLists.txt | head -1) |"
            echo "| benchmark suite | \`${BENCH_REF}\` @ $(git -C benchmarks rev-parse --short HEAD) |"
            echo "| corpus | $(ls benchmarks/workflows/*/*.cpp | wc -l) workflows |"
            echo "| compiler | $(clang++-${CLANG_VERSION} --version | head -1), \`-std=${{ matrix.std }}\` |"
            echo "| bands | blocks above ${SLACK}% per workflow or ${MEDIAN_ALARM}% median, annotates from ${ADVISORY_SLACK}% |"
            echo
            echo "**What this job does:** compiles the mp-units-benchmarks corpus against this tree and"
            echo "counts template instantiations (clang \`-ftime-trace\` events), comparing them against the"
            echo "reviewed baselines in that repository. Counts are deterministic for a pinned compiler and"
            echo "standard, so unlike wall-clock timings they mean something on a shared runner."
            echo
            echo "- **slack ${SLACK}%** - one workflow growing more than this fails this job."
            echo "- **median ${MEDIAN_ALARM}%** - median growth across non-umbrella workflows (\`umbrella/\` is"
            echo "  excluded: it grows legitimately when the systems do). Exceeding it means the framework as"
            echo "  a whole got more expensive, not one workflow."
            echo "- **advisory ${ADVISORY_SLACK}%** - growth above this is annotated here but never fatal."
            echo
            echo "mp-units-benchmarks gates the same numbers tightly (1% per workflow, 0.5% median), so growth"
            echo "merely annotated here goes red there - which is where it gets investigated, without holding"
            echo "up library work. If the growth is intentional, re-record the baselines in that repository."
            echo
            echo "Wall time and peak memory across several compilers are a different question, answered by the"
            echo "\`Compile cost\` workflow in mp-units-benchmarks, which can be dispatched against any ref of"
            echo "this repository."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate against the reviewed baselines
        run: |
          benchmarks/runner/bench.py --repo . --cxx clang++-${{ env.CLANG_VERSION }} --std ${{ matrix.std }} check \
            --slack ${{ env.SLACK }} --median-alarm ${{ env.MEDIAN_ALARM }} \
            --advisory-slack ${{ env.ADVISORY_SLACK }}
