name: Documentation

on:
  push:
    branches:
      - master
      - main
    tags:
      - v*
    # Everything the published site is generated from: the pages themselves, the code snippets they
    # embed from `example/`, and the systems reference `scripts/systems_reference.py` generates out
    # of `src/systems/include/`.
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTORS.md"
      - "LICENSE.md"
      - "mkdocs.yml"
      - "example/**"
      - "scripts/**"
      - "src/**"

  # The same paths on a pull request, so `link-check` (below) reports a broken link while it can
  # still be fixed in the branch rather than after it is published.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTORS.md"
      - "LICENSE.md"
      - "mkdocs.yml"
      - "example/**"
      - "scripts/**"
      - "src/**"

  # A nightly rebuild, so a scheduled blog post publishes itself.
  #
  # The site is static and `blog.draft_if_future_date` (mkdocs.yml) is evaluated at *build* time: a
  # post whose `date` is still in the future is dropped from the build, and it reappears only when
  # something builds the site again on or after that date. Without this, a post dated next Thursday
  # sits invisible until somebody happens to push a docs change, which is exactly the manual step
  # scheduling the post was meant to remove.
  schedule:
    - cron: "29 0 * * *"

  # Publish on demand, without needing a dummy docs commit to trigger a push build.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Supersede an earlier run of the same pull request; a push keeps every run, because the
# publish queue below is what orders those.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # MkDocs logs a broken link and carries on, so a build is green with dead links in it. This job
  # rejects them: before a pull request merges, and before `deploy` can publish them.
  link-check:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The RSS plugin dates each post from its git history and warns when it cannot, which
          # `--strict` would turn into a failure that has nothing to do with links.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Installing pip dependencies
        run: |
          pip install mkdocs-material mkdocs-rss-plugin
      - name: Cache MrDocs
        uses: actions/cache@v5
        with:
          key: mrdocs-${{ hashFiles('scripts/mrdocs/run.py') }}
          path: ~/.cache/mp-units/mrdocs
      - name: Generate API reference
        # The reference is thousands of pages that the rest of the site links into, so this job
        # cannot skip it: without these pages every link into them is dead and `--strict` fails
        # for a reason that has nothing to do with the change under review.
        run: |
          python scripts/mrdocs/run.py
      - name: Building the site with every link checked
        env:
          # Check a scheduled post's links now, rather than the morning it publishes itself.
          MP_UNITS_BLOG_DRAFT_IF_FUTURE_DATE: false
          MP_UNITS_SOCIAL_CARDS: false
        # `--strict` is what makes the `validation:` warnings in `mkdocs.yml` exit non-zero.
        # Without the raised levels there it would still pass: a dead `#fragment` is reported at
        # INFO, which strict mode does not act on.
        run: |
          mkdocs build --strict

  deploy:
    needs: link-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize all documentation publishes into a single queue. The publish step
    # force-pushes a rewritten (squashed) gh-pages branch, so concurrent runs for
    # different refs (e.g. a tag release and a master push) must not overlap or they
    # would clobber each other. Do not cancel in-progress runs: every deploy must
    # complete so its version is recorded.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Prepare git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git fetch origin gh-pages --depth=1
      - name: Cache MrDocs
        uses: actions/cache@v5
        with:
          key: mrdocs-${{ hashFiles('scripts/mrdocs/run.py') }}
          path: ~/.cache/mp-units/mrdocs
      - name: Generate API reference
        # Source links point at the ref being documented, so a release's pages link to that
        # release's code rather than to whatever `master` holds later.
        env:
          MRDOCS_SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          python scripts/mrdocs/run.py
      - name: Installing pip dependencies
        run: |
          pip install conan mkdocs-material mkdocs-rss-plugin mkdocs-material[imaging] mike
      - name: Building docs for a released version
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: |
          mike deploy --update-aliases `conan inspect .  | sed -n -r 's/version: ([0-9]+.[0-9]+).[0-9]+/\1/p'`
      - name: Building docs for a development version
        if: ${{!startsWith(github.event.ref, 'refs/tags/v')}}
        run: |
          mike deploy --update-aliases HEAD latest
      - name: Squash history and publish gh-pages
        run: |
          # `mike deploy` (above, without --push) updated the local gh-pages branch
          # with the new build. GitHub Pages only ever serves the branch tip and the
          # whole site is regenerable, so we collapse gh-pages to a single parentless
          # commit before pushing. This keeps every versioned subtree and versions.json
          # intact (they live in the tree, not in history) while preventing the branch
          # from accumulating obsolete full-site snapshots that bloat the repo.
          tree=$(git rev-parse 'refs/heads/gh-pages^{tree}')
          commit=$(git commit-tree "$tree" -m "docs: published documentation site")
          git update-ref refs/heads/gh-pages "$commit"
          git push --force origin gh-pages

      - name: Generate documentation summary
        if: always()
        run: |
          echo "## 📖 Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Documentation successfully built and deployed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.event.ref }}" == refs/tags/v* ]]; then
              echo "🏷️ **Release Documentation**: Published version-specific docs" >> $GITHUB_STEP_SUMMARY
              echo "📅 **Version**: \`$(conan inspect . | sed -n -r 's/version: ([0-9]+.[0-9]+).[0-9]+/\1/p')\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "🚀 **Development Documentation**: Published to 'latest'" >> $GITHUB_STEP_SUMMARY
              echo "🔗 **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Live Documentation**: https://mpusz.github.io/units/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation build failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the build logs for API reference generation or MkDocs issues." >> $GITHUB_STEP_SUMMARY
          fi
