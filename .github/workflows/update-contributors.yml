name: Update Contributors

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches:
      - master
    paths:
      - ".github/scripts/update_contributors.py"
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update contributors list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_contributors.py

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update contributors list"
          title: "Update Contributors List"
          body: |
            ## 👥 Contributors List Update

            This pull request automatically updates the contributors list with the latest information from GitHub.

            ### Changes

            - Added the contributors who appeared since the last update
            - Refreshed the generated block of `CONTRIBUTORS.md`

            ### Review Notes

            - This is an automated update generated monthly
            - The list merges the GitHub contributors API with the credits in `CHANGELOG.md`
            - The hand-written "Core Team" and "Notable Contributions" sections are untouched

            Generated by GitHub Actions on: ${{ github.run_id }}
          branch: update-contributors
          delete-branch: true
          base: master

      - name: Generate summary
        if: always()
        run: |
          echo "## 👥 Contributors Update Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
            echo "✅ Contributors list updated and PR created" >> $GITHUB_STEP_SUMMARY
            echo "📊 Check the created pull request for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected in contributors list" >> $GITHUB_STEP_SUMMARY
            echo "📈 All contributors are up to date" >> $GITHUB_STEP_SUMMARY
          fi
