name: Codespaces Test

on:
  workflow_dispatch:
  # Everything the dev container's `postCreateCommand` runs or reads: the `.devcontainer/` scripts,
  # and `check_all.sh … install`, which runs `conan install` with `conanfile.py`, which in turn
  # reads the library version from `src/CMakeLists.txt`.
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-test.yml"
      - "conanfile.py"
      - "src/CMakeLists.txt"
  # The same paths on a pull request, so a change that breaks the dev container is caught before
  # it reaches `master` rather than after.
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-test.yml"
      - "conanfile.py"
      - "src/CMakeLists.txt"
  schedule:
    # Test weekly to catch base image changes
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that every VS Code extension exists
        # The runner has no VS Code, so the dev container below never installs the extensions, and
        # an ID that does not exist would pass unnoticed while breaking the installation in a real
        # Codespace. Ask the Marketplace instead.
        shell: python
        run: |
          import json, re, sys, urllib.request

          with open(".devcontainer/devcontainer.json") as f:
              config = json.loads(re.sub(r"^\s*//.*$", "", f.read(), flags=re.M))
          missing = []
          for extension in config["customizations"]["vscode"]["extensions"]:
              query = {"filters": [{"criteria": [{"filterType": 7, "value": extension}]}], "flags": 0}
              request = urllib.request.Request(
                  "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery",
                  data=json.dumps(query).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json;api-version=7.2-preview.1",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  found = json.load(response)["results"][0]["extensions"]
              print("✅" if found else "❌", extension)
              if not found:
                  missing.append(extension)
          if missing:
              sys.exit(f"Not on the VS Code Marketplace: {', '.join(missing)}")

      - name: Pull latest Docker image
        run: docker pull trainiteu/mp-units:latest

      - name: Test Dev Container Build and Setup
        uses: devcontainers/ci@v0.3.1900000417
        env:
          CI_NEVER_BUILD: "1"
        with:
          imageName: mp-units-dev
          cacheFrom: mp-units-dev
          push: never
          runCmd: echo "✅ Devcontainer setup completed successfully with pre-built packages only"
